<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ lil sleeper | Official Site</title>
    <style>
        /* Moving metallic dark gradient background */
        body { 
            margin: 0;
            padding: 40px 20px;
            font-family: sans-serif; 
            text-align: center; 
            background: linear-gradient(-45deg, #0e1118, #232936, #141923, #0b0d13);
            background-size: 400% 400%;
            animation: metallicMotion 12s ease infinite;
            color: #fff; 
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes metallicMotion {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 { 
            color: #fff; 
            font-size: 3.5rem; 
            margin: 0 0 10px 0; 
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        p { 
            color: #8a99ad; 
            font-size: 1.2rem; 
            margin: 0 0 40px 0;
            font-weight: 300;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Cyberpunk metallic buttons */
        .links a { 
            display: inline-block; 
            padding: 14px 28px; 
            background: rgba(20, 24, 33, 0.8); 
            color: #fff; 
            text-decoration: none; 
            border-radius: 6px; 
            border: 1px solid #333f54;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.4s ease; 
        }

        /* Neon Green Glow Hover */
        .links a:hover { 
            background: #000;
            color: #39ff14; 
            border-color: #39ff14;
            box-shadow: 0 0 15px #39ff14, 0 0 30px rgba(57, 255, 20, 0.4);
            transform: translateY(-3px);
        }
    </style>

    <!-- GOOGLE KNOWLEDGE PANEL SCHEMA -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "lil sleeper",
      "alternateName": "DJ lil sleeper",
      "description": "Electronic music producer and DJ based in Richmond, Virginia, specializing in atmospheric house and nostalgic club edits.",
      "homeLocation": {
        "@type": "Place",
        "name": "Richmond, Virginia"
      },
      "sameAs": [
        "https://soundcloud.com/lilsleeperzzz",
        "https://lilsleeper.bandcamp.com"
      ]
    }
    </script>
</head>
<body>

    <h1>DJ lil sleeper</h1>
    <p>Atmospheric House & Nostalgic Club Edits | Richmond, VA</p>

    <div class="links">
        <a href="https://soundcloud.com/lilsleeperzzz" target="_blank">SoundCloud</a>
        <a href="https://lilsleeper.bandcamp.com" target="_blank">Bandcamp</a>
    </div>

</body>
</html>
